name: vfi-exec
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ndk
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: ncnn
        run: |
          wget -q https://github.com/Tencent/ncnn/releases/download/20241128/ncnn-20241128-android-vulkan.zip
          unzip -q ncnn-20241128-android-vulkan.zip
      - name: build
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          CC=$BIN/aarch64-linux-android24-clang++
          CCC=$BIN/aarch64-linux-android24-clang
          N=ncnn-20241128-android-vulkan
          L=$N/arm64-v8a/lib
          $CCC -O2 -c omp_stub.c -o omp_stub.o
          $CC -O2 -std=c++11 -DNDEBUG -DNCNN_STDIO -fno-rtti -fno-exceptions -I$N/arm64-v8a/include \
            vfi_mini.cpp omp_stub.o -o librife_ncnn_vulkan.so \
            -Wl,--start-group \
            $L/libncnn.a $L/libglslang.a $L/libSPIRV.a \
            $L/libglslang-default-resource-limits.a $L/libMachineIndependent.a \
            $L/libGenericCodeGen.a $L/libOSDependent.a \
            -Wl,--end-group \
            -lvulkan -llog -lz -landroid
      - name: collect
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          mkdir -p out
          cp librife_ncnn_vulkan.so out/
          cp $NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so out/
      - uses: actions/upload-artifact@v4
        with:
          name: libvfi
          path: out/*
