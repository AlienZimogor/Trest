name: vfi-export
on: [workflow_dispatch]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          python -m pip install -q numpy onnx
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q pnnx
      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API" \
            | python -c 'import sys,json;d=json.load(sys.stdin);a=[x for x in d.get("assets",[]) if x["name"].lower().endswith(".zip")];print(a[0]["url"] if a else "")')
          echo "asset url: $URL"
          if [ -z "$URL" ]; then echo "NO ZIP ASSET"; exit 1; fi
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" "$URL" -o model.zip
          unzip -o model.zip -d model_src
          find model_src -type f | head -80
      - name: export
        run: python export_rife.py
      - uses: actions/upload-artifact@v4
        with:
          name: rife-models
          path: |
            rife_models.zip
            rife_ifnet.ncnn.param
            rife_ifnet.ncnn.bin
            rife_rifehdv3.ncnn.param
            rife_rifehdv3.ncnn.bin
