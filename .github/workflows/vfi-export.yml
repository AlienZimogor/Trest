name: vfi-export
on: [workflow_dispatch]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: deps
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q numpy onnx onnxscript
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q pnnx

      - name: download release zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API" \
            | python -c 'import sys,json; d=json.load(sys.stdin); a=[x for x in d.get("assets",[]) if x["name"].lower().endswith(".zip")]; print(a[0]["url"] if a else "")')
          echo "asset url: $URL"
          if [ -z "$URL" ]; then echo "NO ZIP ASSET IN LATEST RELEASE"; exit 1; fi
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/octet-stream" "$URL" -o model.zip
          unzip -o model.zip -d model_src
          echo "=== top-level in model_src ==="
          find model_src -maxdepth 3 -type f | sort | head -80
          echo "=== all .py / .pkl / .pth / .pt ==="
          find model_src -type f \( -name "*.py" -o -name "*.pkl" -o -name "*.pth" -o -name "*.pt" \) | sort

      - name: export
        run: python export_rife.py

      - name: pnnx
        run: |
          set +e
          ls -la *.onnx 2>/dev/null
          for onnx in rife_ifnet.onnx rife_rifehdv3.onnx; do
            if [ -f "$onnx" ]; then
              echo "=== running pnnx on $onnx ==="
              pnnx "$onnx" inputshape=[1,7,384,512]
              echo "=== PARAM HEAD of ${onnx%.onnx}.ncnn.param ==="
              head -30 "${onnx%.onnx}.ncnn.param" 2>/dev/null
              echo "=== LAYER TYPES ==="
              awk 'NR>2 {print $1}' "${onnx%.onnx}.ncnn.param" 2>/dev/null | sort | uniq -c | sort -rn
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rife-models
          path: |
            rife_models.zip
            rife_ifnet.onnx
            rife_ifnet.ncnn.param
            rife_ifnet.ncnn.bin
            rife_rifehdv3.onnx
            rife_rifehdv3.ncnn.param
            rife_rifehdv3.ncnn.bin
          if-no-files-found: warn
