name: vfi-export
on: [workflow_dispatch]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: deps
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q numpy onnx onnxscript
          python -m pip install -q torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q pnnx

      - name: download release zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API" \
            | python -c 'import sys,json; d=json.load(sys.stdin); a=[x for x in d.get("assets",[]) if x["name"].lower().endswith(".zip")]; print(a[0]["url"] if a else "")')
          echo "asset url: $URL"
          if [ -z "$URL" ]; then echo "NO ZIP ASSET IN LATEST RELEASE"; exit 1; fi
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/octet-stream" "$URL" -o model.zip
          unzip -o model.zip -d model_src
          find model_src -maxdepth 3 -type f | sort | head -80

      - name: export
        run: python -u -X faulthandler rife_ncnn_writer.py

      - name: pnnx + surgery
        run: |
          set -e
          echo "=== running pnnx on rife_hand.onnx ==="
          pnnx rife_hand.onnx inputshape=[1,7,384,512]
          echo "=== LAYER TYPES before surgery ==="
          awk 'NR>2 {print $1}' rife_hand.ncnn.param | sort | uniq -c | sort -rn
          echo "=== param surgery: GridSample -> rife.Warp ==="
          python rife_param_surgery.py rife_hand.ncnn.param
          echo "=== LAYER TYPES after surgery ==="
          awk 'NR>2 {print $1}' rife_hand.ncnn.param | sort | uniq -c | sort -rn
          head -12 rife_hand.ncnn.param

      - name: repack zip (post-surgery)
        run: |
          set -e
          rm -f rife_models.zip
          mkdir -p zipstage/hand
          cp rife_hand.ncnn.param zipstage/hand/
          cp rife_hand.ncnn.bin   zipstage/hand/
          cd zipstage
          zip -r ../rife_models.zip hand
          cd ..
          unzip -l rife_models.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rife-models
          path: |
            rife_models.zip
            rife_hand.onnx
            rife_hand.ncnn.param
            rife_hand.ncnn.bin
          if-no-files-found: error
