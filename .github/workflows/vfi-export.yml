name: vfi-export
on: [workflow_dispatch]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q numpy
          python -m pip install -q torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: emit
        run: python -u rife_ncnn_emit.py
      - name: pack
        run: |
          mkdir -p zipstage/hand
          cp rife_hand.ncnn.param rife_hand.ncnn.bin zipstage/hand/
          cd zipstage && zip -r ../rife_models.zip hand && cd ..
          unzip -l rife_models.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rife-models
          path: |
            rife_models.zip
            rife_hand.ncnn.param
            rife_hand.ncnn.bin
          if-no-files-found: error
