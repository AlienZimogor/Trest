name: vfi-export
on: [workflow_dispatch]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          python -m pip install -q numpy onnx
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API" \
            | python -c 'import sys,json;d=json.load(sys.stdin);a=[x for x in d.get("assets",[]) if x["name"].lower().endswith(".zip")];print(a[0]["url"] if a else "")')
          echo "asset url: $URL"
          if [ -z "$URL" ]; then echo "NO ZIP ASSET IN LATEST RELEASE"; exit 1; fi
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" "$URL" -o model.zip
          unzip -o model.zip -d model_src
          find model_src -type f | head -50
      - name: export
        run: |
          python - <<'PY'
          import sys, os, glob, importlib.util
          import torch, torch.nn as nn
          pys = [p for p in glob.glob("model_src/**/*.py", recursive=True)
                 if "class IFNet" in open(p, encoding="utf-8", errors="ignore").read(200000)]
          print("IFNet py:", pys)
          spec = importlib.util.spec_from_file_location("prov_ifnet", pys[0])
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          pkls = glob.glob("model_src/**/*.pkl", recursive=True) + \
                 glob.glob("model_src/**/*.pth", recursive=True) + \
                 glob.glob("model_src/**/*.pt", recursive=True)
          print("pkl:", pkls)
          net = m.IFNet()
          sd = torch.load(pkls[0], map_location="cpu", weights_only=False)
          if isinstance(sd, dict) and "state_dict" in sd: sd = sd["state_dict"]
          miss, unexp = net.load_state_dict(sd, strict=False)
          print("MISSING:", list(miss)[:20]); print("UNEXPECTED:", list(unexp)[:20])
          net.eval()
          class W(nn.Module):
              def __init__(s, n): super().__init__(); s.n = n
              def forward(s, x):
                  t = x[:, 6:7].mean(dim=(2, 3), keepdim=True)
                  try: return s.n(x[:, 0:3], x[:, 3:6], timestep=t)
                  except TypeError: return s.n(x[:, 0:3], x[:, 3:6], t)
          w = W(net)
          dummy = torch.randn(1, 7, 288, 512)
          with torch.no_grad():
              ref = w(dummy)
          print("REF out %s mean=%.4f min=%.4f max=%.4f" %
                (tuple(ref.shape), ref.mean(), ref.min(), ref.max()))
          torch.onnx.export(w, dummy, "rife_clean.onnx", opset_version=13,
                            input_names=["in0"], output_names=["out0"],
                            do_constant_folding=True)
          print("EXPORT OK")
          PY
      - name: pnnx
        run: |
          python -m pip install -q pnnx
          pnnx rife_clean.onnx inputshape=[1,7,288,512]
          echo "=== PARAM HEAD ==="
          head -40 rife_clean.ncnn.param
          echo "=== LAYER TYPES ==="
          awk 'NR>2 {print $1}' rife_clean.ncnn.param | sort | uniq -c | sort -rn
      - uses: actions/upload-artifact@v4
        with:
          name: rife-clean
          path: |
            rife_clean.ncnn.param
            rife_clean.ncnn.bin
