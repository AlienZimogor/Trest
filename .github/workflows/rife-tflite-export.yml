name: rife-tflite-export
on: [workflow_dispatch]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q numpy
          python -m pip install -q torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q tensorflow==2.16.1
          python -m pip install -q onnx onnx_graphsurgeon onnx2tf
      - name: download release zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API" \
            | python -c 'import sys,json; d=json.load(sys.stdin); a=[x for x in d.get("assets",[]) if x["name"].lower().endswith(".zip")]; print(a[0]["url"] if a else "")')
          if [ -z "$URL" ]; then echo "NO ZIP ASSET"; exit 1; fi
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$URL" -o model.zip
          unzip -o model.zip -d model_src
      - name: export
        run: python -u rife_tflite_export.py
      - uses: actions/upload-artifact@v4
        with:
          name: rife-tflite
          path: rife_v426.tflite
          if-no-files-found: error
