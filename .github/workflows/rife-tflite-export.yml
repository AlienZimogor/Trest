name: rife-tflite-export
on: [workflow_dispatch]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: deps
        run: |
          python -m pip install -q --upgrade pip
          # TF 2.16 собран против NumPy 1.x и protobuf 4.x — пиним ДО установки TF
          python -m pip install -q "numpy==1.26.4" "protobuf==4.25.3"
          python -m pip install -q torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q tensorflow==2.16.1
          # ПОЛНЫЙ набор скрытых зависимостей onnx2tf (всплывали по одной):
          #   tf_keras   — Keras3-совместимость при TF>=2.16
          #   psutil     — common_functions
          #   ai-edge-litert — LiteRT-рантайм (ai_edge_litert.interpreter)
          #   sng4onnx   — авто-генерация имён операций (onnx2tf.py:63)
          #   onnxruntime — используется отдельными флагами конвертера
          python -m pip install -q tf-keras==2.16.0 psutil ai-edge-litert sng4onnx onnxruntime
          python -m pip install -q onnx==1.16.2 onnx_graphsurgeon onnx2tf
          # финальный контроль: никто не должен был поднять numpy/protobuf
          python -m pip install -q --force-reinstall --no-deps "numpy==1.26.4" "protobuf==4.25.3"
          # проверка ВСЕГО стека onnx2tf ДО экспорта
          python -c "import numpy, google.protobuf, tensorflow as tf, tf_keras, psutil, ai_edge_litert, sng4onnx, onnx, onnx_graphsurgeon, onnx2tf; \
                     print('numpy', numpy.__version__); \
                     print('protobuf', google.protobuf.__version__); \
                     print('tf', tf.__version__); \
                     print('tf_keras', tf_keras.__version__); \
                     print('onnx2tf stack ok')"

      - name: download release zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "$API" \
            | python -c 'import sys,json; d=json.load(sys.stdin); a=[x for x in d.get("assets",[]) if x["name"].lower().endswith(".zip")]; print(a[0]["url"] if a else "")')
          if [ -z "$URL" ]; then echo "NO ZIP ASSET"; exit 1; fi
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$URL" -o model.zip
          unzip -o model.zip -d model_src

      - name: export
        run: python -u rife_tflite_export.py

      - uses: actions/upload-artifact@v4
        with:
          name: rife-tflite
          path: rife_v426.tflite
          if-no-files-found: error
