name: vfi-model
on: [workflow_dispatch]
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: python -m pip install -q onnx onnxsim numpy
      - name: pnnx
        run: |
          set -x
          mkdir -p pnnxdir
          for u in \
            "https://github.com/Tencent/ncnn/releases/download/20260526/pnnx-20260526-ubuntu.zip" \
            "https://github.com/Tencent/ncnn/releases/download/20241128/pnnx-20241128-ubuntu.zip" ; do
            if wget -q "$u"; then
              unzip -q "$(basename "$u")" -d pnnxdir
              break
            fi
          done
          if [ ! -f pnnxdir/pnnx ]; then
            python -m pip install -q pnnx
            cp "$(command -v pnnx)" pnnxdir/pnnx
          fi
          chmod +x pnnxdir/pnnx
          ls -la pnnxdir
      - name: convert
        run: |
          if [ ! -f rife_v4.26.onnx ]; then
            echo "ONNX NOT IN REPO"
            ls -la
            exit 1
          fi
          echo "=== ONNXSIM (fixed 1,7,288,512) ==="
          python -m onnxsim rife_v4.26.onnx rife_sim.onnx --input-shape 1,7,288,512 || true
          SRC=rife_v4.26.onnx
          if [ -f rife_sim.onnx ]; then SRC=rife_sim.onnx; fi
          echo "=== PNNX from $SRC ==="
          ./pnnxdir/pnnx "$SRC" inputshape=[1,7,288,512] || true
          P=""
          if [ -f rife_sim.ncnn.param ]; then P=rife_sim.ncnn.param;
          elif [ -f rife_v4.26.ncnn.param ]; then P=rife_v4.26.ncnn.param; fi
          if [ -z "$P" ]; then echo "PNNX FAILED"; exit 1; fi
          echo "=== PARAM HEAD ==="
          head -30 "$P"
          echo "=== LAYER TYPES ==="
          awk 'NR>2 {print $1}' "$P" | sort | uniq -c | sort -rn
      - uses: actions/upload-artifact@v4
        with:
          name: rife-ncnn
          path: rife_*.ncnn.*
          if-no-files-found: warn
