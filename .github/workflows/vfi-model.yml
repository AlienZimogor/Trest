name: vfi-model
on: [workflow_dispatch]
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pnnx
        run: |
          set -x
          mkdir -p pnnxdir
          for u in \
            "https://github.com/Tencent/ncnn/releases/download/20260526/pnnx-20260526-ubuntu.zip" \
            "https://github.com/Tencent/ncnn/releases/download/20241128/pnnx-20241128-ubuntu.zip" ; do
            if wget -q "$u"; then
              unzip -q "$(basename "$u")" -d pnnxdir
              break
            fi
          done
          if [ ! -f pnnxdir/pnnx ]; then
            python -m pip install -q pnnx
            cp "$(command -v pnnx)" pnnxdir/pnnx
          fi
          chmod +x pnnxdir/pnnx
          ls -la pnnxdir
      - name: convert
        run: |
          if [ ! -f rife_v4.26.onnx ]; then
            echo "ONNX NOT IN REPO: загрузите rife_v4.26.onnx в корень"
            ls -la
            exit 1
          fi
          python -m pip install -q onnx onnxsim numpy || true
          echo "=== ATTEMPT 1: pnnx static 1,7,288,512 ==="
          ./pnnxdir/pnnx rife_v4.26.onnx inputshape=[1,7,288,512] || true
          if [ ! -f rife_v4.26.ncnn.param ]; then
            echo "=== ATTEMPT 2: onnxsim + pnnx ==="
            python -m onnxsim rife_v4.26.onnx rife_sim.onnx --input-shape 1,7,288,512 || true
            ./pnnxdir/pnnx rife_sim.onnx || true
          fi
          if [ ! -f rife_v4.26.ncnn.param ] && [ ! -f rife_sim.ncnn.param ]; then
            echo "BOTH ATTEMPTS FAILED"
            exit 1
          fi
          P=rife_v4.26.ncnn.param
          [ -f "$P" ] || P=rife_sim.ncnn.param
          echo "=== PARAM HEAD ==="
          head -30 "$P"
          echo "=== LAYER TYPES ==="
          awk 'NR>2 {print $1}' "$P" | sort | uniq -c | sort -rn
      - uses: actions/upload-artifact@v4
        with:
          name: rife-ncnn
          path: rife_*.ncnn.*
          if-no-files-found: warn
